<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Quiz</title>

    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <button id="home-btn" class="home-button">
         Inicio
    </button>

<main class="app">

    <!-- ==============================
         PANTALLA PRINCIPAL
    =============================== -->

    <section id="start-screen" class="screen">

        <h1>Quiz</h1>

        <p>¿Qué quieres hacer?</p>

        <button id="start-quiz-btn">
            Responder Trivia
        </button>

        <button id="edit-questions-btn">
            Editar Preguntas
        </button>

    </section>


    <!-- ==============================
         PANTALLA DEL QUIZ
    =============================== -->

    <section id="quiz-screen" class="screen hidden">

        <h2>Quiz</h2>

        <div id="options-container">
            <!-- JavaScript coloca las preguntas aquí -->
        </div>

        <button id="finish-btn">
            Terminar Quiz
        </button>

    </section>


    <!-- ==============================
         PANTALLA DE RESULTADOS
    =============================== -->

    <section id="result-screen" class="screen hidden">

        <h2>¡Quiz terminado!</h2>

        <p id="final-score">
            0 / 5
        </p>

        <button id="restart-btn">
            Volver a empezar
        </button>

    </section>


    <!-- ==============================
         PANTALLA DE EDICIÓN
    =============================== -->

    <section id="edit-screen" class="screen hidden">

        <h2>Editar preguntas</h2>

        <div id="questions-editor">
            <!-- JavaScript genera las preguntas aquí -->
        </div>

        <button id="add-question-btn">
            + Agregar pregunta
        </button>

        <button id="save-questions-btn">
            Guardar cambios
        </button>

        <button id="back-home-btn">
            Volver al inicio
        </button>

    </section>

</main>

    <script src="script.js"></script>
</body>
</html>
